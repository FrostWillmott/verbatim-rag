name: CI

# Every pip install below is constrained by dev-constraints.txt, the same
# generated pin set `make install` uses (regenerate with `make lock`). Without it
# each run resolved fresh releases from PyPI and executed their install-time code
# — in docs.yml that happened in a job holding contents: write.
#
# Actions are pinned by commit SHA for the same reason: a tag is mutable and the
# action runs as code in this workflow. The runner image stays ubuntu-latest —
# it is GitHub-maintained and pinning it buys maintenance, not supply-chain
# safety.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          # Keyed on the pin set, which is the file that changes when the
          # resolved versions do. Every job below installs under
          # `-c dev-constraints.txt`, so the wheels a run needs are the wheels
          # the previous run downloaded unless that file moved.
          cache: pip
          cache-dependency-path: dev-constraints.txt
      - run: pip install -c dev-constraints.txt ruff
      - run: ruff check packages/core/verbatim_core/ verbatim_rag/ api/ tests/
      - run: ruff format --check packages/core/verbatim_core/ verbatim_rag/ api/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: dev-constraints.txt
      - run: pip install -c dev-constraints.txt pytest pytest-asyncio
      - run: pip install -c dev-constraints.txt -e packages/core/
      # The matrix installs verbatim-core only, so it runs the tests that need
      # nothing more. The RAG and API surfaces are covered by test-full below.
      - run: pytest tests/ -v -m "not requires_full_stack"

  test-full:
    # One leg, not a matrix: this installs the root package and with it the whole
    # ML stack, which is slow. The version matrix belongs on the library core,
    # which the `test` job already covers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          # Keyed on the pin set, which is the file that changes when the
          # resolved versions do. Every job below installs under
          # `-c dev-constraints.txt`, so the wheels a run needs are the wheels
          # the previous run downloaded unless that file moved.
          cache: pip
          cache-dependency-path: dev-constraints.txt
      - run: pip install -c dev-constraints.txt pytest pytest-asyncio pytest-cov
      - run: pip install -c dev-constraints.txt -e packages/core/
      - run: pip install -c dev-constraints.txt -e .
      - run: pytest tests/ -v --cov --cov-report=term

  frontend:
    # The frontend was outside CI entirely: a broken build or a lint regression
    # reached main unchallenged. Node 20 because vite 7 requires >= 20.19.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  images:
    # The container images were never built here, so a broken Dockerfile or a
    # constraints file pip cannot parse reached main unchallenged — which is
    # exactly how the container lock's regeneration broke on this branch and went
    # unnoticed for several commits.
    #
    # Built with plain `docker build` rather than a build action: nothing here
    # needs a builder cache or a registry, and two fewer actions is two fewer
    # SHAs to keep pinned.
    #
    # The API image carries the ML stack and is large; if a runner ever runs out
    # of disk, free the preinstalled toolchains before this step rather than
    # dropping the job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t verbatim-api:ci .
      - run: docker build -t verbatim-frontend:ci frontend

  package-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          # Keyed on the pin set, which is the file that changes when the
          # resolved versions do. Every job below installs under
          # `-c dev-constraints.txt`, so the wheels a run needs are the wheels
          # the previous run downloaded unless that file moved.
          cache: pip
          cache-dependency-path: dev-constraints.txt
      - run: pip install -c dev-constraints.txt build twine
      - run: python -m build packages/core
      - run: python -m build .
      - run: twine check packages/core/dist/* dist/*
      # Kept, not just built: `twine check` says the metadata is valid, and the
      # artifact is what lets a person confirm that on the file itself. Short
      # retention because nothing here is released — this is evidence for a run,
      # not a distribution channel.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: |
            dist/*
            packages/core/dist/*
          retention-days: 7

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          # Keyed on the pin set, which is the file that changes when the
          # resolved versions do. Every job below installs under
          # `-c dev-constraints.txt`, so the wheels a run needs are the wheels
          # the previous run downloaded unless that file moved.
          cache: pip
          cache-dependency-path: dev-constraints.txt
      - run: pip install -c dev-constraints.txt pip-audit
      - run: pip install -c dev-constraints.txt packages/core/
      - run: pip-audit
