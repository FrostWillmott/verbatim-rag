name: CI

# Every pip install below is constrained by dev-constraints.txt, the same
# generated pin set `make install` uses (regenerate with `make lock`). Without it
# each run resolved fresh releases from PyPI and executed their install-time code
# — in docs.yml that happened in a job holding contents: write.
#
# Actions are pinned by commit SHA for the same reason: a tag is mutable and the
# action runs as code in this workflow. The runner image stays ubuntu-latest —
# it is GitHub-maintained and pinning it buys maintenance, not supply-chain
# safety.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -c dev-constraints.txt ruff
      - run: ruff check packages/core/verbatim_core/ verbatim_rag/ api/ tests/
      - run: ruff format --check packages/core/verbatim_core/ verbatim_rag/ api/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -c dev-constraints.txt pytest pytest-asyncio
      - run: pip install -c dev-constraints.txt -e packages/core/
      # The matrix installs verbatim-core only, so it runs the tests that need
      # nothing more. The RAG and API surfaces are covered by test-full below.
      - run: pytest tests/ -v -m "not requires_full_stack"

  test-full:
    # One leg, not a matrix: this installs the root package and with it the whole
    # ML stack, which is slow. The version matrix belongs on the library core,
    # which the `test` job already covers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -c dev-constraints.txt pytest pytest-asyncio pytest-cov
      - run: pip install -c dev-constraints.txt -e packages/core/
      - run: pip install -c dev-constraints.txt -e .
      - run: pytest tests/ -v --cov --cov-report=term

  package-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -c dev-constraints.txt build twine
      - run: python -m build packages/core
      - run: python -m build .
      - run: twine check packages/core/dist/* dist/*

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -c dev-constraints.txt pip-audit
      - run: pip install -c dev-constraints.txt packages/core/
      - run: pip-audit
