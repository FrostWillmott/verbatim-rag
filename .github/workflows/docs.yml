name: Docs

# Every pip install below is constrained by dev-constraints.txt, the same
# generated pin set `make install` uses (regenerate with `make lock`). Without it
# each run resolved fresh releases from PyPI and executed their install-time code
# — in docs.yml that happened in a job holding contents: write.
#
# Actions are pinned by commit SHA for the same reason: a tag is mutable and the
# action runs as code in this workflow. The runner image stays ubuntu-latest —
# it is GitHub-maintained and pinning it buys maintenance, not supply-chain
# safety.

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "packages/core/**"
      - "verbatim_rag/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "packages/core/**"
      - "verbatim_rag/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -c dev-constraints.txt mkdocs-material "mkdocstrings[python]"
      - run: pip install -c dev-constraints.txt -e packages/core/
      - run: mkdocs build --strict

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -c dev-constraints.txt mkdocs-material "mkdocstrings[python]"
      - run: pip install -c dev-constraints.txt -e packages/core/
      - run: mkdocs gh-deploy --force
