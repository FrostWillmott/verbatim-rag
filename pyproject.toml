[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verbatim-rag"
version = "0.2.8"
description = "Provenance-first extractive RAG with verbatim source spans and citations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Adam Kovacs", email = "kovacs@krlabs.eu"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "verbatim-core>=0.2.8",

    # Core ML/AI dependencies
    "openai>=1.3.0",
    "numpy>=1.24.3",
    "pandas>=2.0.3",
    "tiktoken>=0.5.1",
    "transformers==4.53.3",
    "torch>=2.6.0",
    "scikit-learn==1.6.1",
    "datasets==3.4.1",

    # Document processing and parsing
    "docling",
    "chonkie",

    # Configuration and data models
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "PyYAML>=6.0",

    # Vector storage and search
    "pymilvus>=2.6.3",
    "pymilvus[milvus_lite]",

    # Embeddings
    "sentence-transformers>=5.0.0",

    # API and web
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",

    # Utilities
    "tqdm>=4.65.0",
    "huggingface_hub>=0.16.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
    # Release and audit tooling. Declared here so CI installs it against
    # dev-constraints.txt instead of resolving fresh versions on every run.
    "build>=1.2.0",
    "twine>=5.0.0",
    "pip-audit>=2.7.0",
]
docs = [
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
]
all = [
    "verbatim-rag[dev,docs]",
]

[project.urls]
"Homepage" = "https://github.com/krlabsorg/verbatim-rag"
"Bug Tracker" = "https://github.com/krlabsorg/verbatim-rag/issues"

[project.scripts]
verbatim-rag = "verbatim_rag.cli:main"
verbatim-enhance = "verbatim_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["verbatim_rag"]

[tool.hatch.build.targets.sdist]
include = [
    "/verbatim_rag",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.uv.sources]
# Read by `make lock`. Without it uv resolves verbatim-core from PyPI and pins
# the published 0.2.8 into dev-constraints.txt, which then fights the editable
# install of packages/core/ that CI, the Dockerfile and `make install` all use.
# The key is uv-specific and ignored by pip, so `pip install .` still resolves
# from the registry exactly as before.
#
# Note for whoever regenerates docker/constraints.txt next: that file currently
# pins verbatim-core==0.2.8 because it predates this key. Regenerating it now
# will drop that pin, since the package resolves to a local path. Verify the
# image still builds before accepting the change.
verbatim-core = { path = "packages/core", editable = true }

[tool.ruff]
# Do not add a standalone ruff.toml alongside this block. Ruff discovers
# ruff.toml first and then ignores [tool.ruff] entirely rather than merging, so
# this configuration would go silent while still looking authoritative.
#
# target-version stays at py310: both manifests declare requires-python >=3.10
# and CI runs a 3.10/3.11/3.12 matrix, so a newer target would let pyupgrade
# emit syntax that breaks the oldest leg.
target-version = "py310"
line-length = 100
extend-exclude = [
    "*.ipynb",
]

[tool.ruff.lint]
# ASYNC added to the upstream set: the project mixes sync and async paths and
# the group reports nothing on the current tree, so it costs nothing today.
select = ["E", "F", "W", "I", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# verbatim_core lives under packages/core/ and is invisible to ruff's src
# inference, so it was being sorted as a third-party package.
known-first-party = ["verbatim_rag", "verbatim_core", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
