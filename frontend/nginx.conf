server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location ^~ /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Required for streaming (ndjson) responses
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # A request that names a file must 404 when the file is missing. The fallback
    # below is right for a client-side route and wrong for an asset: a deleted
    # image came back 200 with text/html, so neither the console nor a check on
    # response codes could see it. `^~` on /api/ above keeps a future endpoint
    # ending in one of these extensions out of this rule.
    location ~* \.(?:png|jpe?g|gif|svg|webp|ico|css|js|mjs|map|json|txt|woff2?|ttf|eot)$ {
        try_files $uri =404;
    }

    # SPA fallback: send all non-file requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
